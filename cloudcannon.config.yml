paths:
  uploads: images
  static: ''
collections_config:
  pages:
    path: ''
    icon: wysiwyg
    url: '/[full_slug].html'
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_editables:
  source:
    options:
      blockquote: true
      bold: true
      format: p h1 h2 h3 h4 h5 h6 pre address div
      italic: true
      underline: true
      strike: true
      link: true
      bulletedlist: true
      numberedlist: true
      image: true
      table: true
      horizontalrule: true
      undo: true
      redo: true
      removeformat: true
timezone: America/New_York
markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: false
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
