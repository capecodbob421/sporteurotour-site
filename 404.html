<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/images/favicon-48.png">
<title>Page Not Found | Sport EuroTour</title>
<style>
  :root{--navy:#2e4d95;--red:#df202c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#222;background:#faf7f2;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:1rem}
  img{max-width:min(300px,70vw);height:auto;margin:0 auto 1.5rem;display:block}
  h1{color:var(--navy);font-size:2rem;margin-bottom:.5rem}
  p{color:#555;margin-bottom:1.5rem}
  a.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;padding:.8rem 1.8rem;border-radius:8px;margin:0 .4rem .6rem}
  a.ghost{background:var(--navy)}
  /* Floating REGISTER HERE button, top right (added Nov 11, 2026). Not a CloudCannon region.
     top = height of the sticky bar(s) above it + a gap. If the header or anchor ribbon changes height, re-check. */
  .fab-reg{position:fixed;top:16px;right:calc(20px + env(safe-area-inset-right,0px));z-index:60;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 26px 10px 18px;background:#df202c;color:#fff;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28);text-decoration:none;line-height:1.1;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,background .15s ease,opacity .25s ease,visibility .25s}
  .fab-reg:hover,.fab-reg:focus-visible{background:#b81a24;color:#fff;transform:translateY(-2px)}
  .fab-reg svg{width:20px;height:20px;flex-shrink:0}
  .fab-reg span{display:flex;flex-direction:column;text-align:center}
  .fab-reg strong{font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .fab-reg em{font-size:15px;font-weight:600;font-style:italic}
  .fab-reg.is-hidden,.fab-reg.is-top{opacity:0;visibility:hidden;pointer-events:none}
  @media(max-width:760px){.fab-reg{top:12px;right:calc(12px + env(safe-area-inset-right,0px));min-height:44px;padding:6px 16px 6px 12px;gap:7px}.fab-reg svg{width:16px;height:16px}.fab-reg strong{font-size:14px}.fab-reg em{font-size:12px}}
  @media print{.fab-reg{display:none}}
</style>
</head>
<body>
<div>
  <img src="/images/eurotour-logo.png" alt="Sport EuroTour">
  <h1>That page took a wrong turn in Amsterdam.</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a class="btn" href="/">Go to the Homepage</a>
  <a class="btn ghost" href="/itinerary27">See the 2027 Tour</a>
</div>
<!-- Floating REGISTER HERE button (Nov 11, 2026). Goes straight to WeTravel ATHLETE registration, new tab. -->
<a class="fab-reg" href="https://eurotour.wetravel.com/trips/the-dutch-training-tour-for-high-school-athletes-2027-sport-eurotour-1804277905" target="_blank" rel="noopener" aria-label="Athlete registration for the 2027 Dutch Training Tour (opens in a new tab)">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
  <span><strong>Register</strong><em>Here</em></span>
</a>
<script>
/* Keep the floating button just below the header (and the red anchor ribbon where a page has one),
   wherever those bars sit as the page scrolls. */
(function(){var b=document.querySelector('.fab-reg');if(!b)return;
var bars=document.querySelectorAll('header.site,nav.anchor-nav');if(!bars.length)return;
function place(){var m=0;for(var i=0;i<bars.length;i++){var r=bars[i].getBoundingClientRect();if(r.bottom>m&&r.top<window.innerHeight/3)m=r.bottom;}
b.style.top=Math.round(Math.max(m,0)+(window.innerWidth<=760?10:14))+'px';
/* Phones: wait until the visitor scrolls, so it never sits on the hero headline. */
b.classList.toggle('is-top',window.innerWidth<=760&&window.scrollY<160);}
place();window.addEventListener('scroll',place,{passive:true});window.addEventListener('resize',place);window.addEventListener('load',place);})();
</script>
</body>
</html>
